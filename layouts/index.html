{{ define "main" }}
<section class="list-page">
  <h1>記事</h1>

  {{ $posts := where .Site.RegularPages "Section" "posts" }}
  {{ if $posts }}
  <ul class="post-list">
    {{ range $posts }}
    <li class="post-item">
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
    </li>
    {{ end }}
  </ul>
  {{ else }}
  <p>記事がありません。</p>
  {{ end }}
</section>
{{ end }}
